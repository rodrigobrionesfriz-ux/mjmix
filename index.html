<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App DJ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>App DJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b2030; --panel:#242a3c; --panel2:#2e3549; --line:#3b4460; --well:#161a26;
  --ink:#ece8df; --dim:#8f97ad;
  --a:#ff6b5b; --b:#46d0a4; --fx:#b388ff; --jump:#7ee081; --smp:#5aa9ff; --hot:#ff9f43;
  --font:"Chakra Petch", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
body{overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,.knob:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;font-size:11px;font-weight:600;
  display:grid;place-items:center;line-height:1.05;text-align:center}
.btn:not(.pad){white-space:nowrap;overflow:hidden}
.btn.on{background:var(--ink);color:var(--bg);border-color:transparent}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px;padding:6px}

/* Formas de onda */
.waves{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 6px}
.wrow{--c:var(--a);grid-column:1;display:grid;grid-template-columns:1fr auto;gap:6px}
.libbtn{grid-column:2;grid-row:1/3;width:66px;display:grid;place-items:center;align-content:center;gap:4px;font-size:10px;font-weight:500}
.libbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}

/* Biblioteca */
.sheet{position:fixed;inset:0;z-index:15;background:var(--bg);display:none;grid-template-rows:auto auto 1fr;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sheet.open{display:grid}
.sheet-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px}
.sheet-head h2{font-size:16px;font-weight:600}
.count{color:var(--dim);font-size:12px;margin-right:4px}
.search{flex:1;min-width:120px;height:32px;background:var(--well);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font:inherit;font-size:13px;padding:0 10px;-webkit-user-select:text;user-select:text}
.sheet-head .btn{height:32px;padding:0 11px;font-size:12px}
.sheet-head .btn[hidden]{display:none}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px 32px 46px 46px;align-items:center;gap:8px}
.cols{padding:4px 10px;font-size:10px;color:var(--dim);border-bottom:1px solid var(--line)}
.cols span:nth-child(n+2){text-align:right}
.list{overflow-y:auto;padding:0 10px 12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{min-height:48px;border-bottom:1px solid var(--panel2)}
.nm{min-width:0}
.nm b{display:block;font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nm small{display:block;font-size:10px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.del{height:32px;color:var(--dim);font-size:14px;border-radius:8px}
.ld{height:34px;border-radius:8px;font-weight:700;font-size:13px;border:1.5px solid var(--dc);color:var(--dc)}
.ld[data-deck="A"]{--dc:var(--a)} .ld[data-deck="B"]{--dc:var(--b)}
.ld.loaded{background:var(--dc);color:var(--bg)}
.empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px;line-height:1.5}

/* Diálogo */
.modal{position:fixed;inset:0;z-index:25;background:rgba(10,12,20,.6);display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:380px;width:100%;display:grid;gap:8px}
.dlg h3{font-size:16px;font-weight:600}
.dlg p{font-size:13px;color:var(--dim);line-height:1.45}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.acts .btn{height:38px;padding:0 16px;font-size:13px}
.acts .ok{background:var(--a);color:var(--bg);border-color:transparent}
.wrow[data-deck="B"]{--c:var(--b)}
.wbox{display:grid;grid-template-rows:1fr 6px;gap:2px;height:clamp(40px,11vh,96px);min-width:0}
.wave{position:relative;background:var(--well);border-radius:6px;overflow:hidden;touch-action:none;border-left:3px solid var(--c)}
.winfo{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:2px 7px;font-size:11px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.winfo .l{display:flex;gap:6px;min-width:0}
.winfo b{color:var(--c)}
.winfo .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.winfo .r{display:flex;gap:10px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.winfo .r span:not(.bp){color:var(--dim)}
.hint{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--dim)}
.hint[hidden],.ov-head[hidden]{display:none}
.overview{position:relative;background:var(--well);border-radius:3px;overflow:hidden;touch-action:none}
.ov-head{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);left:0}
.load{padding:0 12px;font-size:12px}
canvas{display:block;width:100%;height:100%}

/* Cuerpo del controlador */
.body{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;min-height:0}
.deck{--c:var(--a);background:var(--panel);border-radius:12px;padding:6px;display:grid;
  grid-template-columns:40px minmax(0,1fr);gap:6px;min-height:0;min-width:0}
.deck[data-deck="B"]{--c:var(--b);grid-template-columns:minmax(0,1fr) 40px}
.deck[data-deck="B"] .tempo{order:2}
.tempo{display:grid;grid-template-rows:auto 1fr auto auto;justify-items:center;gap:4px;min-height:0}
.range{font-size:10px;color:var(--dim);padding:2px 4px;border:1px solid var(--line);border-radius:5px}
.pv{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}
.sync{width:38px;height:clamp(26px,7vh,40px);font-size:10px}
.main{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:5px;min-height:0;min-width:0}
.loops{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.loops .btn{height:clamp(24px,6.5vh,40px)}
.loops .btn.on{background:var(--c);color:var(--bg)}
.jogwrap{min-height:0;display:grid;place-items:center}
.jog{position:relative;height:100%;max-width:100%;aspect-ratio:1;border-radius:50%;
  background:#1a1f2d;border:2px solid var(--line);touch-action:none;box-shadow:inset 0 0 0 3px var(--well)}
.platter{position:absolute;inset:4px;border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.035) 3px 4px)}
.mark{position:absolute;left:50%;top:3%;width:4px;height:20%;margin-left:-2px;border-radius:2px;background:var(--c)}
.jog-center{position:absolute;inset:34%;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:700;color:var(--c);font-size:clamp(12px,3vh,22px)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.modes .btn{height:clamp(20px,5.5vh,34px);font-size:10px;font-weight:500;color:var(--dim)}
.modes .btn.on{background:var(--m);color:var(--bg);font-weight:700}
.perf{display:grid;grid-template-columns:44px 1fr;gap:5px}
.tp{display:grid;grid-template-rows:1fr 1fr;gap:4px}
.tp .btn{font-size:11px;border-radius:10px}
.play svg{width:18px;height:18px;fill:currentColor}
.play.on{background:var(--c);color:var(--bg);border-color:transparent}
.cue.on{border-color:var(--ink)}
.pads{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(30px,9vh,66px);gap:4px}
.pad{overflow:hidden;border-radius:6px;background:var(--panel2);border:1.5px solid color-mix(in srgb,var(--pc) 50%,transparent);
  font-size:9.5px;line-height:1.1;color:var(--dim);display:grid;place-items:center;text-align:center;touch-action:none}
.pad.set{background:color-mix(in srgb,var(--pc) 32%,var(--panel2));color:var(--ink);font-weight:600}
.pad.lit{background:var(--pc);color:var(--bg);border-color:transparent;font-weight:700}

/* Faders y perillas */
.fader{position:relative;touch-action:none}
.fader.v{width:30px;height:100%;min-height:50px}
.fader.v::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--well);border-radius:2px}
.fader.v .thumb{position:absolute;left:0;right:0;height:18px;bottom:calc(var(--p,.5) * (100% - 18px));
  background:var(--thumb,var(--ink));border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.fader.v .thumb::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;margin-top:-1px;background:var(--bg)}
.pf::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.fader.h{height:32px;width:100%}
.fader.h::before{content:"";position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;background:var(--well);border-radius:2px}
.fader.h::after{content:"";position:absolute;left:50%;top:7px;bottom:7px;width:1px;background:var(--line)}
.fader.h .thumb{position:absolute;top:0;bottom:0;width:24px;left:calc(var(--p,.5) * (100% - 24px));z-index:1;
  background:var(--ink);border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.fader.h .thumb::after{content:"";position:absolute;top:6px;bottom:6px;left:50%;width:2px;margin-left:-1px;background:var(--bg)}
.knob-wrap{display:grid;justify-items:center;gap:1px;font-size:9px;color:var(--dim)}
.knob{position:relative;width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);touch-action:none}
.knob::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:9px;margin-left:-1.5px;border-radius:2px;
  background:var(--kc,var(--ink));transform-origin:50% 11px;transform:rotate(var(--r,0deg))}

/* Mixer */
.mixer{background:var(--panel);border-radius:12px;padding:6px 8px;display:grid;
  grid-template-columns:auto auto auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"sa fx sb" "fa mt fb" "xf xf xf";gap:6px 8px;min-height:0}
.strip{display:grid;grid-template-columns:repeat(2,auto);gap:2px 6px;align-content:start}
.strip .filt{grid-column:1/-1}
.strip[data-deck="A"]{grid-area:sa} .strip[data-deck="A"] .knob{--kc:var(--a)}
.strip[data-deck="B"]{grid-area:sb} .strip[data-deck="B"] .knob{--kc:var(--b)}
.fxp{grid-area:fx;display:grid;gap:4px;align-content:start;width:104px}
.fxrow{display:grid;grid-template-columns:22px 1fr 22px;gap:3px;align-items:center;height:22px}
.fxrow .btn{height:22px;font-size:10px}
.fxrow span{text-align:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:3px;height:22px}
.seg .btn{font-size:9.5px;font-weight:500}
.fxk{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;justify-items:center}
.fxk .knob{--kc:var(--fx)}
.fxon{width:30px;height:28px;margin-bottom:10px;font-size:10px}
.fxon.on{background:var(--fx)}
.cf{justify-self:center;height:100%;min-height:0}
.cf[data-deck="A"]{grid-area:fa;--thumb:var(--a)}
.cf[data-deck="B"]{grid-area:fb;--thumb:var(--b)}
.meters{grid-area:mt;display:flex;justify-content:center;gap:6px}
.meter{position:relative;width:6px;background:var(--well);border-radius:3px;overflow:hidden}
.meter i{position:absolute;inset:0;transform-origin:bottom;transform:scaleY(0);
  background:linear-gradient(to top,#58c47a 0 65%,#ffd23f 65% 85%,#ff5a4f 85%)}
.xrow{grid-area:xf;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-weight:700;font-size:13px}
.xrow .la{color:var(--a)} .xrow .lb{color:var(--b)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:30}
.toast.show{opacity:1}

.rotate{display:none}
@media (orientation:portrait) and (max-width:760px){
  .app{visibility:hidden}
  .rotate{display:grid;position:fixed;inset:0;place-items:center;align-content:center;gap:16px;
    background:var(--bg);z-index:20;text-align:center;padding:32px;font-size:16px;color:var(--dim)}
  .rotate svg{width:72px;height:72px;stroke:var(--ink);fill:none;stroke-width:1.5}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main class="app">
  <section class="waves">
    <div class="wrow" data-deck="A"></div>
    <div class="wrow" data-deck="B"></div>
    <button class="btn libbtn" aria-label="Abrir biblioteca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 5.5l3.6 1-3.4 13-3.6-1z"/></svg>Biblioteca</button>
  </section>

  <section class="body">
    <div class="deck" data-deck="A"></div>

    <div class="mixer" aria-label="Mixer">
      <div class="strip" data-deck="A"></div>
      <div class="fxp">
        <div class="fxrow"><button class="btn fxprev" aria-label="Efecto anterior">◀</button><span class="fxname">Eco</span><button class="btn fxnext" aria-label="Efecto siguiente">▶</button></div>
        <div class="fxrow"><button class="btn bdown" aria-label="Menos beats">−</button><span class="fxbeat">1 beat</span><button class="btn bup" aria-label="Más beats">+</button></div>
        <div class="seg"><button class="btn" data-ch="A">A</button><button class="btn" data-ch="M">Master</button><button class="btn" data-ch="B">B</button></div>
        <div class="fxk">
          <label class="knob-wrap"><div class="knob fxlevel" tabindex="0"></div>Nivel</label>
          <button class="btn fxon">On</button>
          <label class="knob-wrap"><div class="knob smpvol" tabindex="0"></div>Sampler</label>
        </div>
      </div>
      <div class="strip" data-deck="B"></div>
      <div class="fader v cf" data-deck="A" aria-label="Volumen A"></div>
      <div class="meters"><div class="meter" data-deck="A"><i></i></div><div class="meter" data-deck="B"><i></i></div></div>
      <div class="fader v cf" data-deck="B" aria-label="Volumen B"></div>
      <div class="xrow"><span class="la">A</span><div class="fader h xf" aria-label="Crossfader"></div><span class="lb">B</span></div>
    </div>

    <div class="deck" data-deck="B"></div>
  </section>
</main>

<section class="sheet" aria-label="Biblioteca">
  <div class="sheet-head">
    <h2>Biblioteca</h2><span class="count"></span>
    <input class="search" type="search" placeholder="Buscar tema" aria-label="Buscar tema">
    <button class="btn libdir">Agregar carpeta</button>
    <button class="btn libfiles">Agregar temas</button>
    <button class="btn libclear">Vaciar</button>
    <button class="btn libclose" aria-label="Cerrar biblioteca">Cerrar</button>
    <input type="file" class="in-dir" webkitdirectory multiple hidden>
    <input type="file" class="in-files" multiple hidden>
  </div>
  <div class="cols"><span>Tema</span><span>Duración</span><span>BPM</span><span></span><span></span><span></span></div>
  <div class="list"></div>
</section>

<div class="modal" role="dialog" aria-modal="true">
  <div class="dlg"><h3></h3><p></p>
    <div class="acts"><button class="btn cancel">Cancelar</button><button class="btn ok">Aceptar</button></div></div>
</div>
<div class="rotate">
  <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="14" width="32" height="20" rx="3"/><path d="M14 8a14 14 0 0 1 20 0M34 8l0 -4M34 8l-4 0"/></svg>
  Gira el teléfono para mezclar
</div>
<div class="toast" role="status"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const COL = { A: '#ff6b5b', B: '#46d0a4' };
const HC = ['#ff6b5b', '#ff9f43', '#ffd23f', '#7ee081', '#46d0a4', '#5aa9ff', '#8c7bff', '#e879c9'];
const RANGES = [0.08, 0.16, 0.5];
const LOOP_SIZES = [1 / 8, 1 / 4, 1 / 2, 1, 2, 4, 8, 16, 32];
const MODES = [
  { k: 'hot', l: 'Hot cue', c: 'var(--hot)' },
  { k: 'fx', l: 'Pad FX', c: 'var(--fx)' },
  { k: 'jump', l: 'Salto', c: 'var(--jump)' },
  { k: 'smp', l: 'Sampler', c: 'var(--smp)' }
];
const PADFX = [
  { l: 'Roll<br>½', roll: .5 }, { l: 'Roll<br>¼', roll: .25 }, { l: 'Roll<br>⅛', roll: .125 }, { l: 'Roll<br>1/16', roll: .0625 },
  { l: 'Eco', k: 'echo' }, { l: 'Filtro<br>HP', k: 'hp' }, { l: 'Filtro<br>LP', k: 'lp' }, { l: 'Freno', k: 'brake' }
];
const JUMPS = [-1, -4, -8, -16, 1, 4, 8, 16];
const SAMPLE_NAMES = ['Bombo', 'Palma', 'Hat', 'Caja', 'Bocina', 'Láser', 'Subida', 'Sub'];
const FX_TYPES = ['Eco', 'Reverb', 'Flanger', 'Phaser'];
const FX_BEATS = [1 / 4, 1 / 2, 3 / 4, 1, 2, 4];
const WIN = 8, PPS = 100;
const FORMATS = [['.mp3', 'audio/mpeg'], ['.m4a', 'audio/mp4'], ['.aac', 'audio/aac'], ['.wav', 'audio/wav'],
  ['.flac', 'audio/flac'], ['.ogg', 'audio/ogg'], ['.opus', 'audio/ogg; codecs=opus'], ['.webm', 'audio/webm']];
const OK_FORMATS = (() => {
  const probe = document.createElement('audio');
  const ok = FORMATS.filter(([, m]) => probe.canPlayType && probe.canPlayType(m) !== '');
  return ok.length ? ok : FORMATS.slice(0, 4);
})();
const EXTS = OK_FORMATS.map(([e]) => e);
const ACCEPT = [...new Set(OK_FORMATS.flatMap(([e, m]) => [e, m.split(';')[0]]))].join(',');
const EXT_LIST = EXTS.map(e => e.slice(1).toUpperCase()).join(', ');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
const frac = b => ({ 0.125: '⅛', 0.25: '¼', 0.5: '½', 0.75: '¾', 0.0625: '1/16' })[b] || String(b);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* =================== Motor de audio =================== */
let ctx = null, bus, out, smpGain, fx = null, xval = .5;
const fxS = { type: 0, beat: 3, ch: 'M', level: .5, on: false, smp: .8 };
let samples = [], smpSrc = Array(8).fill(null);

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -2; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = .002; comp.release.value = .1;
    out = ctx.createGain(); out.connect(comp); comp.connect(ctx.destination);
    bus = ctx.createGain(); bus.connect(out);

let lib = [], dbp = null;

  }

function fader(el, { vertical, def, onChange }) {
  el.innerHTML = '<div class="thumb"></div>';
  let v = def, sx = 0, sy = 0, sv = 0, last = 0;
  const set = (nv, silent) => { v = clamp(nv, 0, 1); el.style.setProperty('--p', v); if (!silent) onChange(v); };
  el.addEventListener('pointerdown', e => {
    const now = performance.now();
    if (now - last < 280) { last = 0; set(def); return; }
    last = now; el.setPointerCapture(e.pointerId); sx = e.clientX; sy = e.clientY; sv = v;
  });
  el.addEventListener('pointermove', e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    const len = vertical ? el.clientHeight - 18 : el.clientWidth - 24;
    set(sv + (vertical ? sy - e.clientY : e.clientX - sx) / Math.max(40, len));
  });
  set(def);
  return { set, get: () => v };
}
function knob(el, def, onChange) {
  let v = def, sy = 0, sv = 0, last = 0;
  const set = nv => { v = clamp(nv, 0, 1); el.style.setProperty('--r', (v - .5) * 270 + 'deg'); onChange(v); };
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const now = performance.now();
    if (now - last < 280) { last = 0; set(def); return; }
    last = now; el.setPointerCapture(e.pointerId); sy = e.clientY; sv = v;
  });
  el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) set(sv + (sy - e.clientY) / 120); });
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') set(v + .05);
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') set(v - .05);
  });
  set(def);
}

function sizeCanvas(c) {
  const r = c.getBoundingClientRect(), w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }

function drawOverview(d) {
  const c = d.el.ov, g = d.og, W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);

  const n = d.peaks.length, step = Math.max(1, Math.round(2 * dpr));
  g.fillStyle = COL[d.id] + 'b3';
  for (let x = 0; x < W; x += step) {

    let m = 0; for (let i = a; i < b && i < n; i++) if (d.peaks[i] > m) m = d.peaks[i];
    const h = Math.max(1, m * H); g.fillRect(x, (H - h) / 2, Math.max(1, step - 1), h);
  }
}
function drawWave(d, pos) {
  const c = d.el.wave, g = d.wg, W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);

  if (d.loop) {

    g.fillStyle = 'rgba(236,232,223,.6)'; g.fillRect(x1, 0, dpr, H); g.fillRect(x2 - dpr, 0, dpr, H);
  }
  const played = new Path2D(), ahead = new Path2D();

function frame() {

      d.level = Math.max(pk, d.level * .9);

function fit(el) {

  el.style.fontSize = '';
  let fs = parseFloat(getComputedStyle(el).fontSize), g = 0;
  while ((el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1) && fs > 6 && g++ < 30) {
    fs -= .5; el.style.fontSize = fs + 'px';

function syncDeck(d) {
  const o = decks.find(x => x !== d);
  if (!d.bpm || !o.bpm) { toast(d.analyzing || o.analyzing ? 'Analizando BPM, prueba en un momento' : 'Sync necesita que ambos decks tengan BPM'); return; }
  let ratio = o.bpm * (1 + o.pitch) / d.bpm;
  if (ratio > 1.4) ratio /= 2; else if (ratio < .7) ratio *= 2;
  const p = ratio - 1;
  if (Math.abs(p) > .5) { toast('Los tempos están demasiado lejos para sincronizar'); return; }
  if (Math.abs(p) > d.range) d.range = RANGES.find(r => r >= Math.abs(p));
  d.bend = 0; d.pitch = p; d.pf.set(.5 + p / (2 * d.range), true); d.updateRate();
  let msg = 'Tempo igualado';
  if (d.playing && o.playing && !d.braking && !d.slip) {
    const pd = d.pos(), po = o.pos(), fo = beatPhase(o, po), fd = beatPhase(d, pd);
    if (fo != null && fd != null) {

      let diff = fo / (1 + o.pitch) - fd / (1 + d.pitch);          // en segundos reales
      diff = ((diff % B) + B * 1.5) % B - B / 2;
      const shift = diff * (1 + d.pitch);
      if (Math.abs(shift) > .004) d.seek(pd + shift);
      msg = 'Tempo y beats alineados';
    }

  refresh(d); toast(msg);
  d.el.sync.classList.add('on'); setTimeout(() => d.el.sync.classList.remove('on'), 250);
}

function padDown(d, i, btn) {

  if (!d.buffer) { toast('Primero carga una pista'); return; }
  d.held.add(i);
  if (d.mode === 'hot') {
    if (d.hot[i] == null) { d.hot[i] = d.pos(); }
    else {
      const t = d.hot[i];
      if (d.loop && (t < d.loop.start || t >= d.loop.end)) d.loop = null;
      d.seek(t); if (!d.playing) { d.play(); keepAwake(); }
      btn._t = setTimeout(() => { d.hot[i] = null; d.held.delete(i); refresh(d); toast(`Hot cue ${i + 1} borrado`); }, 700);
    }
  } else if (d.mode === 'fx') {
    const f = PADFX[i];
    if (!d.playing) { toast('Los Pad FX funcionan con la pista sonando'); d.held.delete(i); return; }
    if (f.roll) { if (!d.bpm) toast('El roll necesita el BPM de la pista'); d.rollStart(f.roll); }
    else if (f.k === 'echo') d.echo(true);
    else if (f.k === 'brake') d.brake();

}

  if (d.mode === 'fx') {
    const f = PADFX[i];
    if (f.roll) d.rollEnd();

  });

  d.el.play.addEventListener('pointerdown', () => {
    if (!d.buffer) { toast('Primero carga una pista'); return; }
    if (d.playing) d.pause(); else { d.play(); keepAwake(); }
    refresh(d);
  });
  let cueTap = 0, cueBefore = 0;
  d.el.cue.addEventListener('pointerdown', () => {
    if (!d.buffer) return;
    const now = performance.now();
    if (now - cueTap < 350) {                 // segundo toque: al inicio del tema
      cueTap = 0; d.cue = cueBefore;          // deshace lo que hizo el primer toque
      d.pause(); d.loop = null; d.loopIn = null; d.seek(0);
      refresh(d); toast(`Deck ${d.id} al inicio`); return;
    }
    cueTap = now; cueBefore = d.cue;
    if (d.playing) { d.pause(); if (d.loop && (d.cue < d.loop.start || d.cue >= d.loop.end)) d.loop = null; d.seek(d.cue); }
    else if (Math.abs(d.offset - d.cue) > .01) d.cue = d.offset;
    refresh(d);
  });
  d.el.sync.addEventListener('pointerdown', () => syncDeck(d));

  const need = fn => () => { if (!d.buffer) { toast('Primero carga una pista'); return; } fn(); refresh(d); };
  d.el.lin.addEventListener('pointerdown', need(() => d.markIn()));
  $('.lout', r).addEventListener('pointerdown', need(() => d.markOut()));
  d.el.lauto.addEventListener('pointerdown', need(() => d.autoLoop()));
  $('.lhalf', r).addEventListener('pointerdown', () => { d.resizeLoop(.5); refresh(d); });
  $('.ldbl', r).addEventListener('pointerdown', () => { d.resizeLoop(2); refresh(d); });

  d.el.modes.forEach(b => b.addEventListener('click', () => {
    [...d.held].forEach(i => padUp(d, i, d.el.pads[i]));
    d.mode = b.dataset.m; refresh(d);
  }));
  d.el.pads.forEach(p => {
    const i = +p.dataset.i;
    p.addEventListener('pointerdown', e => { p.setPointerCapture(e.pointerId); padDown(d, i, p); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => p.addEventListener(ev, () => padUp(d, i, p)));
  });

  d.el.range.addEventListener('click', () => {
    d.range = RANGES[(RANGES.indexOf(d.range) + 1) % RANGES.length];
    if (Math.abs(d.pitch) > d.range) { d.pitch = Math.sign(d.pitch) * d.range; d.updateRate(); }
    d.pf.set(.5 + d.pitch / (2 * d.range), true); refresh(d);
  });
  d.pf = fader($('.pf', r), { vertical: true, def: .5,
    onChange: v => { d.pitch = Math.abs(v - .5) < .012 ? 0 : (v - .5) * 2 * d.range; d.updateRate(); refresh(d); } });

  // Jog
  const jog = $('.jog', r); let last = null, cx = 0, cy = 0, bendT;
  jog.addEventListener('pointerdown', e => {
    if (!d.buffer) return;
    jog.setPointerCapture(e.pointerId);
    const b = jog.getBoundingClientRect(); cx = b.left + b.width / 2; cy = b.top + b.height / 2;
    last = Math.atan2(e.clientY - cy, e.clientX - cx);
  });
  jog.addEventListener('pointermove', e => {
    if (last === null || !jog.hasPointerCapture(e.pointerId)) return;
    const a = Math.atan2(e.clientY - cy, e.clientX - cx);
    let da = a - last; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI; last = a;
    if (d.playing) { d.bend = clamp(da * 5, -.6, .6); d.updateRate(); clearTimeout(bendT); bendT = setTimeout(() => { d.bend = 0; d.updateRate(); }, 70); }
    else d.seek(d.offset + da / (2 * Math.PI) * 1.8);
  });
  const jogEnd = () => { last = null; if (d.bend) { d.bend = 0; d.updateRate(); } };
  jog.addEventListener('pointerup', jogEnd); jog.addEventListener('pointercancel', jogEnd);

  // Arrastrar la forma de onda
  const wave = $('.wave', w); let ws = null;
  wave.addEventListener('pointerdown', e => {
    if (!d.buffer) return;
    wave.setPointerCapture(e.pointerId);
    ws = { x: e.clientX, t: d.pos(), was: d.playing, w: wave.clientWidth };
    d.pause(); refresh(d);
  });
  wave.addEventListener('pointermove', e => { if (ws) d.seek(ws.t - (e.clientX - ws.x) / ws.w * WIN); });
  const waveEnd = () => { if (!ws) return; if (ws.was) d.play(); ws = null; refresh(d); };
  wave.addEventListener('pointerup', waveEnd); wave.addEventListener('pointercancel', waveEnd);

  const ov = $('.overview', w);
  const ovSeek = e => { const b = ov.getBoundingClientRect(); d.seek((e.clientX - b.left) / b.width * d.duration); };
  ov.addEventListener('pointerdown', e => { if (!d.buffer) return; ov.setPointerCapture(e.pointerId); ovSeek(e); });
  ov.addEventListener('pointermove', e => { if (d.buffer && ov.hasPointerCapture(e.pointerId)) ovSeek(e); });

  // Canal del mixer
  const strip = $(`.strip[data-deck="${d.id}"]`); strip.innerHTML = stripHTML();
  $$('.knob', strip).forEach(k => knob(k, .5, v => { d.eq[k.dataset.k] = v; k.dataset.k === 'filt' ? d.applyFilter() : d.applyEq(); }));
  fader($(`.cf[data-deck="${d.id}"]`), { vertical: true, def: .9, onChange: v => { d.vol = v; d.applyVol(); } });
}

/* =================== Arranque =================== */
const decks = [new Deck('A'), new Deck('B')];
decks.forEach(d => { wire(d); refresh(d); });
fader($('.xf'), { vertical: false, def: .5, onChange: v => { xval = v; applyXfader(); } });

$('.fxprev').addEventListener('click', () => { fxS.type = (fxS.type + FX_TYPES.length - 1) % FX_TYPES.length; applyFx(); });
$('.fxnext').addEventListener('click', () => { fxS.type = (fxS.type + 1) % FX_TYPES.length; applyFx(); });
$('.bdown').addEventListener('click', () => { fxS.beat = Math.max(0, fxS.beat - 1); applyFx(); });
$('.bup').addEventListener('click', () => { fxS.beat = Math.min(FX_BEATS.length - 1, fxS.beat + 1); applyFx(); });
$$('.seg .btn').forEach(b => b.addEventListener('click', () => { fxS.ch = b.dataset.ch; applyFx(); }));
$('.fxon').addEventListener('pointerdown', () => { fxS.on = !fxS.on; applyFx(); });
knob($('.fxlevel'), .5, v => { fxS.level = v; applyFx(); });
knob($('.smpvol'), .8, v => { fxS.smp = v; if (smpGain) smpGain.gain.value = v * v * 1.2; });
applyFx();

$('.libbtn').addEventListener('click', () => { $('.sheet').classList.add('open'); renderLib(); });
$('.libclose').addEventListener('click', () => $('.sheet').classList.remove('open'));
$('.search').addEventListener('input', renderLib);
const inDir = $('.in-dir'), inFiles = $('.in-files');
inFiles.setAttribute('accept', ACCEPT);
if (!('webkitdirectory' in inDir)) $('.libdir').hidden = true;
$('.libdir').addEventListener('click', () => inDir.click());
$('.libfiles').addEventListener('click', () => inFiles.click());
[inDir, inFiles].forEach(inp => inp.addEventListener('change', () => { const f = [...inp.files]; inp.value = ''; libAdd(f); }));
$('.libclear').addEventListener('click', async () => {
  if (!lib.length) return;
  if (!await ask('Vaciar biblioteca', 'Se quitan todos los temas de la app. Los archivos originales en tu teléfono no se borran.', 'Vaciar')) return;
  try { await tx('readwrite', st => st.clear()); } catch (e) {}
  lib = []; renderLib();
});
$('.list').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = +row.dataset.id;
  if (e.target.closest('.del')) libRemove(id);
  else { const b = e.target.closest('.ld'); if (b) loadFromLib(id, b.dataset.deck); }
});
$('.modal .ok').addEventListener('click', () => closeAsk(true));
$('.modal .cancel').addEventListener('click', () => closeAsk(false));
$('.modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAsk(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && askResolve) closeAsk(false); });
libLoad();

new ResizeObserver(layout).observe($('.app'));
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
requestAnimationFrame(frame);

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
</body>
