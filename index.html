<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App DJ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>App DJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b2030; --panel:#242a3c; --panel2:#2e3549; --line:#3b4460; --well:#161a26;
  --ink:#ece8df; --dim:#8f97ad;
  --a:#ff6b5b; --b:#46d0a4; --fx:#b388ff; --jump:#7ee081; --smp:#5aa9ff; --bloop:#ffb454; --hot:#ff9f43;
  --font:"Chakra Petch", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
body{overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,.knob:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;font-size:11px;font-weight:600;
  display:grid;place-items:center;line-height:1.05;text-align:center}
.btn:not(.pad){white-space:nowrap;overflow:hidden}
.btn.on{background:var(--ink);color:var(--bg);border-color:transparent}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:6px;padding:6px}

/* Barra superior: forma de onda de cada deck y botones centrales */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px}
.wrow{--c:var(--a);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;min-width:0}
.side{width:clamp(128px,17vw,190px);display:grid;grid-template-rows:1fr 1fr;gap:4px}
.side .btn{font-size:11px;font-weight:600}
.ambtn.on{background:var(--fx);color:var(--bg);border-color:transparent}
.btn[hidden]{display:none}
.amopt{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-top:4px}
.amseg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.amseg .btn{height:32px;font-size:12px;font-weight:500}
.amseg .btn.on{background:var(--fx);color:var(--bg)}
.am .acts{flex-wrap:wrap}
.am .ok{background:var(--fx)}

/* Biblioteca */
.sheet{position:fixed;inset:0;z-index:15;background:var(--bg);display:none;grid-template-rows:auto auto 1fr;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.sheet.open{display:grid}
.sheet-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px}
.sheet-head h2{font-size:16px;font-weight:600}
.count{color:var(--dim);font-size:12px;margin-right:4px}
.search{flex:1;min-width:120px;height:32px;background:var(--well);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font:inherit;font-size:13px;padding:0 10px;-webkit-user-select:text;user-select:text}
.sheet-head .btn{height:32px;padding:0 11px;font-size:12px}
.sheet-head .btn[hidden]{display:none}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px 32px 46px 46px;align-items:center;gap:8px}
.cols{padding:4px 10px;font-size:10px;color:var(--dim);border-bottom:1px solid var(--line)}
.cols span:nth-child(n+2){text-align:right}
.list{overflow-y:auto;padding:0 10px 12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{min-height:48px;border-bottom:1px solid var(--panel2)}
.nm{min-width:0}
.nm b{display:block;font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nm small{display:block;font-size:10px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.del{height:32px;color:var(--dim);font-size:14px;border-radius:8px}
.ld{height:34px;border-radius:8px;font-weight:700;font-size:13px;border:1.5px solid var(--dc);color:var(--dc)}
.ld[data-deck="A"]{--dc:var(--a)} .ld[data-deck="B"]{--dc:var(--b)}
.ld.loaded{background:var(--dc);color:var(--bg)}
.empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px;line-height:1.5}

/* Diálogo */
.modal{position:fixed;inset:0;z-index:25;background:rgba(10,12,20,.6);display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:380px;width:100%;display:grid;gap:8px}
.dlg h3{font-size:16px;font-weight:600}
.dlg p{font-size:13px;color:var(--dim);line-height:1.45}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.acts .btn{height:38px;padding:0 16px;font-size:13px}
.acts .ok{background:var(--a);color:var(--bg);border-color:transparent}
.wrow[data-deck="B"]{--c:var(--b)}
.wbox{display:grid;grid-template-rows:1fr 6px;gap:2px;height:clamp(44px,13vh,92px);min-width:0}
.wave{position:relative;background:var(--well);border-radius:6px;overflow:hidden;touch-action:none;border-left:3px solid var(--c)}
.winfo{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:2px 7px;font-size:11px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.winfo .l{display:flex;gap:6px;min-width:0}
.winfo b{color:var(--c)}
.winfo .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.winfo .r{display:flex;gap:10px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.winfo .r span:not(.bp){color:var(--dim)}
.hint{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--dim)}
.hint[hidden],.ov-head[hidden]{display:none}
.overview{position:relative;background:var(--well);border-radius:3px;overflow:hidden;touch-action:none}
.ov-head{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);left:0}
.load{padding:0 8px;font-size:11px}
canvas{display:block;width:100%;height:100%}

/* Cuerpo: deck, mixer angosto, deck */
.body{display:grid;grid-template-columns:minmax(0,1fr) clamp(128px,17vw,190px) minmax(0,1fr);gap:6px;min-height:0}
.deck{--c:var(--a);background:var(--panel);border-radius:12px;padding:6px;display:grid;
  grid-template-columns:44px minmax(0,1fr);gap:6px;min-height:0;min-width:0}
.deck[data-deck="B"]{--c:var(--b);grid-template-columns:minmax(0,1fr) 44px}
.deck[data-deck="B"] .tempo{order:2}
.key{width:42px;height:24px;font-size:10px}
.key.on{background:var(--c);color:var(--bg);border-color:transparent}
.tempo{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto auto;justify-items:center;gap:5px;min-height:0}
.range{font-size:10px;color:var(--dim);padding:2px 4px;border:1px solid var(--line);border-radius:5px}
.pv{font-size:9px;color:var(--dim);font-variant-numeric:tabular-nums}
.sync,.cue{width:42px;height:clamp(28px,8vh,44px);font-size:11px}
.sync{border:1.5px solid var(--c);color:var(--c)}
.sync.on{background:var(--c);color:var(--bg)}
.cue.on{border-color:var(--ink)}
.main{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;min-height:0;min-width:0}
.stage{position:relative;min-height:0}
.jogwrap{position:absolute;inset:0;display:grid;place-items:center}
.jog{position:relative;height:100%;max-width:100%;aspect-ratio:1;border-radius:50%;background:#1a1f2d;touch-action:none;
  border:3px solid color-mix(in srgb,var(--c) 45%,var(--line));
  box-shadow:0 0 0 4px var(--well),0 0 22px color-mix(in srgb,var(--c) 22%,transparent)}
.jog.touch{border-color:var(--c)}
.platter{position:absolute;inset:4px;border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.035) 3px 4px)}
.mark{position:absolute;left:50%;top:3%;width:4px;height:18%;margin-left:-2px;border-radius:2px;background:var(--c)}
.jog-center{position:absolute;inset:31%;border-radius:50%;background:var(--well);border:1px solid var(--line);
  display:grid;place-items:center;align-content:center;pointer-events:none;line-height:1}
.jog-center .bp{font-size:clamp(14px,5.5vh,32px);font-weight:700;font-variant-numeric:tabular-nums}
.jog-center small{font-size:clamp(8px,2vh,12px);color:var(--dim);margin-top:3px}
.corner{position:absolute;z-index:2;height:28px;padding:0 7px;font-size:10px}
.tl{top:0;left:0} .bl{bottom:0;left:0} .br{bottom:0;right:0}
.nudge{width:34px;height:34px;padding:0;border-radius:50%;font-size:17px}
.vinyl.on{background:var(--c);color:var(--bg);border-color:transparent}
.panel{position:absolute;inset:0;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:6px;display:grid;grid-template-rows:minmax(0,1fr);overflow:auto}
.panel[hidden],.pane[hidden]{display:none}
.pane{display:grid;gap:6px;align-content:center;min-height:0}
.pane[data-tab="pads"]{grid-template-rows:auto minmax(0,1fr);align-content:stretch}
.pane[data-tab="pads"] .pads{grid-auto-rows:auto;grid-template-rows:1fr 1fr}
.pane[data-tab="loop"]{grid-template-rows:1fr 1fr 1fr;align-content:stretch}
.pane[data-tab="loop"] .loops .btn{height:100%}
.pane[data-tab="loop"] .lsizes{grid-row:2/4;grid-template-rows:1fr 1fr}
.pane[data-tab="loop"] .lsizes .btn{height:100%}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;height:clamp(34px,10vh,52px)}
.deck[data-deck="B"] .bar{grid-template-columns:minmax(0,1fr) auto}
.deck[data-deck="B"] .bar .play{order:2}
.play{width:clamp(52px,9vw,84px);border-radius:10px}
.play svg{width:20px;height:20px;fill:currentColor}
.play.on{background:var(--c);color:var(--bg);border-color:transparent}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs .btn{font-size:11px;color:var(--dim)}
.tabs .btn.on{background:var(--c);color:var(--bg);border-color:transparent}
.loops{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.loops .btn{height:clamp(30px,9vh,48px);font-size:12px}
.loops .btn.on{background:var(--c);color:var(--bg)}
.lsizes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.lsizes .btn{height:clamp(28px,8vh,44px);font-size:12px;font-weight:500}
.lsizes .btn.on{background:var(--panel2);border:1.5px solid var(--c);color:var(--c)}
.modes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.modes .btn{height:clamp(22px,6vh,34px);font-size:10px;font-weight:500;color:var(--dim)}
.modes .btn.on{background:var(--m);color:var(--bg);font-weight:700}
.pads{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(30px,10vh,64px);gap:4px}
.pad{overflow:hidden;border-radius:6px;background:var(--panel2);border:1.5px solid color-mix(in srgb,var(--pc) 50%,transparent);
  font-size:9.5px;line-height:1.1;color:var(--dim);display:grid;place-items:center;text-align:center;touch-action:none}
.pad.set{background:color-mix(in srgb,var(--pc) 32%,var(--panel2));color:var(--ink);font-weight:600}
.pad.lit{background:var(--pc);color:var(--bg);border-color:transparent;font-weight:700}

/* Faders y perillas */
.fader{position:relative;touch-action:none}
.fader.v{width:30px;height:100%;min-height:50px}
.fader.v::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--well);border-radius:2px}
.fader.v .thumb{position:absolute;left:0;right:0;height:18px;bottom:calc(var(--p,.5) * (100% - 18px));
  background:var(--thumb,var(--ink));border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.fader.v .thumb::after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;margin-top:-1px;background:var(--bg)}
.pf::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.fader.h{height:32px;width:100%}
.fader.h::before{content:"";position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;background:var(--well);border-radius:2px}
.fader.h::after{content:"";position:absolute;left:50%;top:7px;bottom:7px;width:1px;background:var(--line)}
.fader.h .thumb{position:absolute;top:0;bottom:0;width:24px;left:calc(var(--p,.5) * (100% - 24px));z-index:1;
  background:var(--ink);border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.fader.h .thumb::after{content:"";position:absolute;top:6px;bottom:6px;left:50%;width:2px;margin-left:-1px;background:var(--bg)}
.knob-wrap{display:grid;justify-items:center;gap:1px;font-size:9px;color:var(--dim)}
.knob{--ks:28px;position:relative;width:var(--ks);height:var(--ks);border-radius:50%;background:var(--panel2);border:1px solid var(--line);touch-action:none}
.knob::after{content:"";position:absolute;left:50%;top:calc(var(--ks) * .1);width:3px;height:calc(var(--ks) * .3);margin-left:-1.5px;border-radius:2px;
  background:var(--kc,var(--ink));transform-origin:50% calc(var(--ks) * .4);transform:rotate(var(--r,0deg))}

/* EQ y efectos dentro de los paneles del deck */
.pane .strip{display:flex;flex-wrap:wrap;justify-content:space-around;align-items:center;gap:8px}
.pane .knob{--ks:44px}
.pane .knob-wrap{font-size:10px;gap:3px}
.strip[data-deck="A"] .knob{--kc:var(--a)} .strip[data-deck="B"] .knob{--kc:var(--b)}
.fxhome{display:none}
.fxp{display:grid;gap:6px;width:100%;max-width:300px;margin:0 auto}
.fxrow{display:grid;grid-template-columns:34px 1fr 34px;gap:4px;align-items:center;height:30px}
.fxrow .btn{height:30px;font-size:12px}
.fxrow span{text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:4px;height:30px}
.seg .btn{font-size:11px;font-weight:500}
.fxk{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;justify-items:center}
.fxk .knob{--kc:var(--fx)}
.fxon{width:46px;height:34px;margin-bottom:15px;font-size:12px}
.fxon.on{background:var(--fx)}

/* ============ Vista de PC y tablet: distribución de controlador de dos canales ============ */
.desk{display:none}
body.dk .app{display:none}
body.dk .desk{display:grid}
.desk{height:100%;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px;font-size:clamp(11px,.9vw,16px)}
.d-top{display:grid;grid-template-columns:minmax(0,1fr) clamp(120px,10vw,180px);gap:8px}
.d-waves{display:grid;gap:5px;min-width:0}
.d-waves .wrow{grid-template-columns:minmax(0,1fr) clamp(76px,6vw,120px)}
.d-waves .wbox{height:clamp(54px,9.5vh,130px)}
.d-waves .winfo{font-size:clamp(11px,.85vw,15px);padding:3px 9px}
.d-waves .load{font-size:inherit}
.d-side{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:5px}
.d-side .side{width:auto}
.d-side .side .btn,.fsbtn{font-size:inherit}
.fsbtn{height:clamp(28px,4vh,42px)}
.d-body{display:grid;grid-template-columns:minmax(0,1fr) clamp(290px,28vw,480px) minmax(0,1fr);gap:8px;min-height:0}
.d-deck{--c:var(--a);--tw:clamp(54px,4.6vw,84px);background:var(--panel);border-radius:14px;padding:clamp(8px,1vw,16px);
  display:grid;gap:clamp(6px,.8vw,12px);min-height:0;min-width:0;
  grid-template-columns:var(--tw) minmax(0,1fr);
  grid-template-rows:clamp(30px,5.5vh,56px) minmax(0,1fr) clamp(26px,4.2vh,44px) clamp(90px,22vh,240px);
  grid-template-areas:"tempo loops" "tempo jog" "tempo modes" "tempo perf"}
.d-deck[data-deck="B"]{--c:var(--b);grid-template-columns:minmax(0,1fr) var(--tw);grid-template-areas:"loops tempo" "jog tempo" "modes tempo" "perf tempo"}
.s-loops{grid-area:loops;display:grid;min-width:0}
.s-loops .loops,.s-modes .modes{height:100%}
.s-loops .btn,.s-modes .btn{height:100%;font-size:inherit}
.s-tempo{grid-area:tempo;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;justify-items:center;gap:8px;min-height:0}
.s-tempo .key,.s-tempo .sync{width:100%;height:clamp(28px,5vh,52px);font-size:inherit}
.s-tempo .fader.v{width:clamp(30px,2.6vw,48px)}
.s-tempo .pv,.s-tempo .range{font-size:clamp(10px,.75vw,13px)}
.s-jog{grid-area:jog;position:relative;min-height:0}
.s-jog .stage{position:absolute;inset:0}
.s-jog .corner{height:clamp(28px,4.5vh,44px);font-size:clamp(10px,.8vw,14px);padding:0 10px}
.s-jog .nudge{width:clamp(34px,4.5vh,50px);height:clamp(34px,4.5vh,50px);padding:0;font-size:clamp(16px,1.4vw,24px)}
.desk .jog-center .bp{font-size:clamp(18px,3.4vw,54px)}
.desk .jog-center small{font-size:clamp(10px,.8vw,14px)}
.s-modes{grid-area:modes;display:grid;min-width:0}
.s-perf{grid-area:perf;display:grid;grid-template-columns:clamp(62px,6.5vw,120px) minmax(0,1fr);gap:clamp(6px,.8vw,12px);min-height:0}
.s-tp{display:grid;grid-template-rows:1fr 1fr;gap:clamp(6px,.8vw,12px)}
.s-tp .btn{width:100%;height:100%;border-radius:16px;font-size:inherit}
.s-tp .play svg{width:clamp(18px,1.8vw,30px);height:clamp(18px,1.8vw,30px)}
.s-pads{display:grid;min-height:0}
.s-pads .pads{height:100%;grid-auto-rows:auto;grid-template-rows:1fr 1fr;gap:clamp(4px,.6vw,10px)}
.s-pads .pad{font-size:clamp(10px,.85vw,15px);border-radius:10px}
.d-mixer{background:var(--panel);border-radius:14px;padding:clamp(8px,1vw,16px);display:grid;
  grid-template-columns:1fr minmax(0,1.5fr) 1fr;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"sa fx sb" "fa mt fb" "xf xf xf";gap:clamp(8px,1vw,14px);min-height:0}
.s-strip[data-deck="A"]{grid-area:sa} .s-strip[data-deck="B"]{grid-area:sb}
.s-strip .strip{display:grid;justify-items:center;gap:clamp(3px,.7vh,10px)}
.s-strip .knob{--ks:clamp(32px,3.1vw,56px)}
.s-strip .knob-wrap,.s-fx .knob-wrap{font-size:clamp(9px,.7vw,13px)}
.s-fx{grid-area:fx;display:grid;align-content:start;min-width:0}
.s-fx .fxp{max-width:none}
.s-fx .knob{--ks:clamp(32px,2.9vw,52px)}
.s-fx .fxrow,.s-fx .seg{height:clamp(26px,4vh,42px)}
.s-fx .fxrow{grid-template-columns:clamp(28px,2.4vw,42px) 1fr clamp(28px,2.4vw,42px)}
.s-fx .fxrow .btn{height:100%}
.s-fx .btn,.s-fx .fxrow span{font-size:inherit}
.s-fx .fxon{width:clamp(40px,3.6vw,64px);height:clamp(30px,4.5vh,46px);margin-bottom:clamp(14px,1.4vw,22px)}
.s-fa{grid-area:fa} .s-fb{grid-area:fb} .s-mt{grid-area:mt} .s-xf{grid-area:xf}
.s-fa,.s-fb,.s-mt{display:grid;grid-template-rows:minmax(0,1fr);justify-items:center;min-height:0}
.d-mixer .s-fa .cf,.d-mixer .s-fb .cf,.d-mixer .s-mt .meters,.d-mixer .s-xf .xrow{grid-area:auto;height:auto;align-self:stretch}
.d-mixer .cf,.d-mixer .meters,.d-mixer .xrow{grid-area:auto}
.d-mixer .cf{width:clamp(30px,2.6vw,48px)}
.d-mixer .meter{width:clamp(7px,.6vw,12px)}
.s-xf .xrow{font-size:inherit}
.s-xf .fader.h{height:clamp(32px,5vh,52px)}

/* Mixer */
.mixer{background:var(--panel);border-radius:12px;padding:8px;display:grid;
  grid-template-columns:1fr auto 1fr;grid-template-rows:minmax(0,1fr) auto auto;
  grid-template-areas:"fa mt fb" "sm sm sm" "xf xf xf";gap:8px 6px;min-height:0}
.cf{justify-self:center;height:100%;min-height:0}
.cf[data-deck="A"]{grid-area:fa;--thumb:var(--a)}
.cf[data-deck="B"]{grid-area:fb;--thumb:var(--b)}
.meters{grid-area:mt;display:flex;justify-content:center;gap:5px}
.meter{position:relative;width:7px;background:var(--well);border-radius:3px;overflow:hidden}
.meter i{position:absolute;inset:0;transform-origin:bottom;transform:scaleY(0);
  background:linear-gradient(to top,#58c47a 0 65%,#ffd23f 65% 85%,#ff5a4f 85%)}
.smp{grid-area:sm;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.smp .btn{height:clamp(26px,7vh,38px);font-size:10px}
.smp .btn[data-deck="A"]{color:var(--a)} .smp .btn[data-deck="B"]{color:var(--b)}
.xrow{grid-area:xf;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;font-weight:700;font-size:12px}
.xrow .la{color:var(--a)} .xrow .lb{color:var(--b)}

.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:30}
.toast.show{opacity:1}

.rotate{display:none}
@media (orientation:portrait) and (max-width:760px){
  .app{visibility:hidden}
  .rotate{display:grid;position:fixed;inset:0;place-items:center;align-content:center;gap:16px;
    background:var(--bg);z-index:20;text-align:center;padding:32px;font-size:16px;color:var(--dim)}
  .rotate svg{width:72px;height:72px;stroke:var(--ink);fill:none;stroke-width:1.5}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const COL = { A: '#ff6b5b', B: '#46d0a4' };
const HC = ['#ff6b5b', '#ff9f43', '#ffd23f', '#7ee081', '#46d0a4', '#5aa9ff', '#8c7bff', '#e879c9'];
const RANGES = [0.08, 0.16, 0.5];
const LOOP_SIZES = [1 / 8, 1 / 4, 1 / 2, 1, 2, 4, 8, 16, 32];
const MODES = [
  { k: 'hot', l: 'Hot cue', c: 'var(--hot)' },
  { k: 'loop', l: 'Beat loop', c: 'var(--bloop)' },
  { k: 'jump', l: 'Salto', c: 'var(--jump)' },
  { k: 'smp', l: 'Sampler', c: 'var(--smp)' },
  { k: 'fx', l: 'Pad FX', c: 'var(--fx)' }
];
const PADFX = [
  { l: 'Roll<br>½', roll: .5 }, { l: 'Roll<br>¼', roll: .25 }, { l: 'Roll<br>⅛', roll: .125 }, { l: 'Roll<br>1/16', roll: .0625 },
  { l: 'Eco', k: 'echo' }, { l: 'Filtro<br>HP', k: 'hp' }, { l: 'Filtro<br>LP', k: 'lp' }, { l: 'Freno', k: 'brake' }
];
const BEAT_LOOPS = [.25, .5, 1, 2, 4, 8, 16, 32];
const JUMPS = [-1, -4, -8, -16, 1, 4, 8, 16];
const SAMPLE_NAMES = ['Bombo', 'Palma', 'Hat', 'Caja', 'Bocina', 'Láser', 'Subida', 'Sub'];
const FX_TYPES = ['Eco', 'Delay', 'Reverb', 'Flanger', 'Phaser', 'Trans'];
const FX_BEATS = [1 / 4, 1 / 2, 3 / 4, 1, 2, 4];
const WIN = 8, PPS = 100;
const FORMATS = [['.mp3', 'audio/mpeg'], ['.m4a', 'audio/mp4'], ['.aac', 'audio/aac'], ['.wav', 'audio/wav'],
  ['.flac', 'audio/flac'], ['.ogg', 'audio/ogg'], ['.opus', 'audio/ogg; codecs=opus'], ['.webm', 'audio/webm']];
const OK_FORMATS = (() => {
  const probe = document.createElement('audio');
  const ok = FORMATS.filter(([, m]) => probe.canPlayType && probe.canPlayType(m) !== '');
  return ok.length ? ok : FORMATS.slice(0, 4);
})();
const EXTS = OK_FORMATS.map(([e]) => e);
const ACCEPT = [...new Set(OK_FORMATS.flatMap(([e, m]) => [e, m.split(';')[0]]))].join(',');
const EXT_LIST = EXTS.map(e => e.slice(1).toUpperCase()).join(', ');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
const frac = b => ({ 0.125: '⅛', 0.25: '¼', 0.5: '½', 0.75: '¾', 0.0625: '1/16' })[b] || String(b);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* =================== Motor de audio =================== */
const SCRATCH_CODE = `
class Scratch extends AudioWorkletProcessor {
  constructor() {
    super();
    this.l = null; this.r = null; this.pos = 0; this.vel = 0; this.target = 0; this.active = false; this.n = 0;
    this.port.onmessage = e => {
      const m = e.data;
      if (m.type === 'start') { this.l = m.l; this.r = m.r || m.l; this.pos = m.pos; this.target = m.pos; this.vel = m.vel || 0; this.active = true; }
      else if (m.type === 'target') this.target = m.pos;
      else if (m.type === 'stop') { this.active = false; this.l = this.r = null; }
    };
  }
  process(inputs, outputs) {
    const out = outputs[0], L = out[0], R = out[1];
    if (!this.active || !this.l) return true;
    const N = L.length, len = this.l.length;
    // la púa persigue la posición del dedo: alcanza el objetivo en ~3 bloques
    const v1 = Math.max(-6, Math.min(6, (this.target - this.pos) / (N * 3))), v0 = this.vel;
    for (let i = 0; i < N; i++) {
      this.pos += v0 + (v1 - v0) * (i + 1) / N;
      if (this.pos < 0) this.pos = 0; else if (this.pos > len - 2) this.pos = len - 2;
      const j = this.pos | 0, f = this.pos - j;
      L[i] = this.l[j] + (this.l[j + 1] - this.l[j]) * f;
      if (R) R[i] = this.r[j] + (this.r[j + 1] - this.r[j]) * f;
    }
    this.vel = v1;
    if ((this.n++ & 1) === 0) this.port.postMessage(this.pos);
    return true;
  }
}
registerProcessor('scratch', Scratch);

// Tono fijo: cambia el tempo sin cambiar el tono (WSOLA: superpone trozos de 46 ms buscando el punto que mejor calza)
class Stretch extends AudioWorkletProcessor {
  constructor() {
    super();
    const W = 2048, H = 1024;
    this.W = W; this.H = H; this.S = 256;
    this.win = new Float32Array(W); for (let i = 0; i < W; i++) this.win[i] = .5 - .5 * Math.cos(2 * Math.PI * i / W);
    this.accL = new Float32Array(W); this.accR = new Float32Array(W);
    this.hopL = new Float32Array(H); this.hopR = new Float32Array(H);
    this.l = null; this.r = null; this.len = 0; this.active = false; this.ready = 0; this.hi = 0; this.prev = -1;
    this.port.onmessage = e => {
      const m = e.data;
      if (m.type === 'load') { this.l = m.l; this.r = m.r || m.l; this.len = m.l.length; }
      else if (m.type === 'play' || m.type === 'sync') {
        Object.assign(this, { offset: m.offset, startedAt: m.startedAt, rate: m.rate, loop: m.loop, dur: m.dur });
        if (m.type === 'play') { this.active = true; this.ready = 0; this.prev = -1; this.accL.fill(0); this.accR.fill(0); }
      } else if (m.type === 'stop') this.active = false;
    };
  }
  nominal(t) {
    let p = this.offset + (t - this.startedAt) * this.rate;
    if (this.loop && p >= this.loop.end) { const L = this.loop.end - this.loop.start; p = this.loop.start + ((p - this.loop.start) % L); }
    return p;
  }
  g(a, i) { return i >= 0 && i < this.len ? a[i] / 32768 : 0; }
  makeHop(t) {
    const W = this.W, H = this.H, S = this.S, p = Math.round(this.nominal(t) * sampleRate);
    let start = p;
    if (this.prev >= 0 && Math.abs(p - (this.prev + H)) < 4 * W) {
      const nat = this.prev + H; let best = 0, bs = -Infinity;
      for (let d = -S; d <= S; d += 2) {
        let c = 0; const b = p + d;
        for (let k = 0; k < H; k += 4) c += (this.g(this.l, nat + k) + this.g(this.r, nat + k)) * (this.g(this.l, b + k) + this.g(this.r, b + k));
        if (c > bs) { bs = c; best = d; }
      }
      start = p + best;
    }
    this.accL.copyWithin(0, H); this.accL.fill(0, W - H);
    this.accR.copyWithin(0, H); this.accR.fill(0, W - H);
    for (let k = 0; k < W; k++) { const w = this.win[k]; this.accL[k] += w * this.g(this.l, start + k); this.accR[k] += w * this.g(this.r, start + k); }
    this.hopL.set(this.accL.subarray(0, H)); this.hopR.set(this.accR.subarray(0, H));
    this.ready = H; this.hi = 0; this.prev = start;
  }
  process(inputs, outputs) {
    const out = outputs[0], L = out[0], R = out[1];
    if (!this.active || !this.l) return true;
    if (!this.loop && this.nominal(currentTime) >= this.dur) { this.active = false; this.port.postMessage('ended'); return true; }
    const N = L.length; let i = 0;
    while (i < N) {
      if (this.ready === 0) this.makeHop(currentTime + i / sampleRate);
      const n = Math.min(N - i, this.ready);
      L.set(this.hopL.subarray(this.hi, this.hi + n), i);
      if (R) R.set(this.hopR.subarray(this.hi, this.hi + n), i);
      i += n; this.hi += n; this.ready -= n;
    }
    return true;
  }
}
registerProcessor('stretch', Stretch);`;
let scratchReady = false, workletFailed = false;
async function initScratch() {
  try {
    const url = URL.createObjectURL(new Blob([SCRATCH_CODE], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    decks.forEach(d => {
      d.scr = new AudioWorkletNode(ctx, 'scratch', { numberOfInputs: 0, outputChannelCount: [2] });
      d.scr.connect(d.trim);
      d.scr.port.onmessage = e => { if (d.scratching) d.scrPos = d.scrBase + e.data / d.buffer.sampleRate; };
      d.st = new AudioWorkletNode(ctx, 'stretch', { numberOfInputs: 0, outputChannelCount: [2] });
      d.st.connect(d.trim);
      d.st.port.onmessage = e => { if (e.data === 'ended' && d.stActive) { d.stActive = false; d.playing = false; d.offset = d.duration; refresh(d); } };
    });
    scratchReady = true;
  } catch (e) { scratchReady = false; workletFailed = true; }
}

let ctx = null, bus, out, smpGain, fx = null, xval = .5;
const fxS = { type: 0, beat: 3, ch: 'M', level: .5, on: false, smp: .8 };
let samples = [], smpSrc = Array(8).fill(null);

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -2; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = .002; comp.release.value = .1;
    out = ctx.createGain(); out.connect(comp); comp.connect(ctx.destination);
    bus = ctx.createGain(); bus.connect(out);
    smpGain = ctx.createGain(); smpGain.gain.value = fxS.smp * fxS.smp * 1.2; smpGain.connect(bus);
    decks.forEach(d => d.initAudio());
    initScratch();
    buildFx(); applyXfader(); applyFx();
    buildSamples().then(b => { samples = b; });
  }
  if (ctx.state !== 'running') ctx.resume();
  return ctx;
}
document.addEventListener('pointerdown', ensureCtx, { capture: true });

class Deck {
  constructor(id) {
    Object.assign(this, {
      id, buffer: null, src: null, playing: false, offset: 0, startedAt: 0, curRate: 1,
      pitch: 0, bend: 0, range: .08, cue: 0, hot: Array(8).fill(null), bpm: null, analyzing: false,
      peaks: null, name: '', vol: .9, level: 0, loop: null, loopIn: null, loopBeats: 4,
      mode: 'hot', vinyl: true, keylock: false, stActive: false, scratching: false, slip: null, braking: null, held: new Set(),
      eq: { gain: .5, high: .5, mid: .5, low: .5, filt: .5 }
    });
  }
  initAudio() {
    const c = ctx, bq = (type, f, q = .7) => { const n = c.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
    this.trim = c.createGain();
    this.low = bq('lowshelf', 250); this.mid = bq('peaking', 1000, .8); this.high = bq('highshelf', 3500);
    this.hp = bq('highpass', 20); this.lp = bq('lowpass', 20000);
    this.post = c.createGain(); this.fader = c.createGain(); this.xf = c.createGain();
    this.echoSend = c.createGain(); this.echoSend.gain.value = 0;
    this.echoDelay = c.createDelay(3); this.echoFb = c.createGain(); this.echoFb.gain.value = .45;
    this.echoOut = c.createGain(); this.echoOut.gain.value = .8;
    this.an = c.createAnalyser(); this.an.fftSize = 512; this.tbuf = new Float32Array(512);
    this.trim.connect(this.low); this.low.connect(this.mid); this.mid.connect(this.high);
    this.high.connect(this.hp); this.hp.connect(this.lp); this.lp.connect(this.post);
    this.gate = c.createGain();
    this.post.connect(this.gate); this.gate.connect(this.fader); this.fader.connect(this.xf); this.xf.connect(bus);
    this.post.connect(this.echoSend); this.echoSend.connect(this.echoDelay);
    this.echoDelay.connect(this.echoFb); this.echoFb.connect(this.echoDelay);
    this.echoDelay.connect(this.echoOut); this.echoOut.connect(this.fader);
    this.fader.connect(this.an);
    this.applyEq(); this.applyFilter(); this.applyVol();
  }
  applyEq() {
    if (!this.trim) return;
    const db = v => v < .5 ? (v - .5) * 52 : (v - .5) * 12;
    this.low.gain.value = db(this.eq.low); this.mid.gain.value = db(this.eq.mid); this.high.gain.value = db(this.eq.high);
    this.trim.gain.value = Math.pow(10, ((this.eq.gain - .5) * 24) / 20);
  }
  applyFilter() {
    if (!this.hp) return;
    const v = this.eq.filt, now = ctx.currentTime;
    const lpF = v < .49 ? 200 * Math.pow(100, v / .5) : 20000;
    const hpF = v > .51 ? 20 * Math.pow(400, (v - .5) / .5) : 20;
    for (const [n, f, q] of [[this.lp, lpF, v < .49 ? 3 : .7], [this.hp, hpF, v > .51 ? 3 : .7]]) {
      n.frequency.cancelScheduledValues(now); n.frequency.setTargetAtTime(f, now, .03);
      n.Q.cancelScheduledValues(now); n.Q.setValueAtTime(q, now);
    }
  }
  applyVol() { if (this.fader) this.fader.gain.value = this.vol * this.vol; }
  get rate() { return (1 + this.pitch) * (1 + this.bend); }
  get duration() { return this.buffer ? this.buffer.duration : 0; }
  beat() { return this.bpm ? 60 / this.bpm : null; }                 // en tiempo de la pista
  realBeat() { return this.bpm ? 60 / (this.bpm * (1 + this.pitch)) : .5; } // en segundos reales
  pos() {
    if (this.scratching) return this.scrPos;
    if (!this.playing) return this.offset;
    const e = ctx.currentTime - this.startedAt;
    if (this.braking) { const T = this.braking.T, x = Math.min(e, T); return Math.min(this.duration, this.offset + this.braking.r0 * (x - x * x / (2 * T))); }
    let p = this.offset + e * this.curRate;
    if (this.loop && p >= this.loop.end) { const L = this.loop.end - this.loop.start; p = this.loop.start + ((p - this.loop.start) % L); }
    return Math.min(this.duration, p);
  }

  const len = chs[0].length, spb = buf.sampleRate / PPS;

    let m = 0;
    for (let j = s; j < e; j += 2) for (const ch of chs) { const v = Math.abs(ch[j]); if (v > m) m = v; }
    out[i] = m; if (m > max) max = m;

  if (max > 0) for (let i = 0; i < n; i++) out[i] /= max;

  });
  wave.addEventListener('pointermove', e => { if (ws) d.seek(ws.t - (e.clientX - ws.x) / ws.w * WIN); });
  const waveEnd = () => { if (!ws) return; if (ws.was) d.play(); ws = null; refresh(d); };
  wave.addEventListener('pointerup', waveEnd); wave.addEventListener('pointercancel', waveEnd);

  const ov = $('.overview', w);
  const ovSeek = e => { const b = ov.getBoundingClientRect(); d.seek((e.clientX - b.left) / b.width * d.duration); };
  ov.addEventListener('pointerdown', e => { if (!d.buffer) return; ov.setPointerCapture(e.pointerId); ovSeek(e); });
  ov.addEventListener('pointermove', e => { if (d.buffer && ov.hasPointerCapture(e.pointerId)) ovSeek(e); });

  // Canal del mixer
  const strip = $(`.strip[data-deck="${d.id}"]`); strip.innerHTML = stripHTML();
  d.knobs = {};
  $$('.knob', strip).forEach(k => { d.knobs[k.dataset.k] = knob(k, .5, v => { d.eq[k.dataset.k] = v; k.dataset.k === 'filt' ? d.applyFilter() : d.applyEq(); }); });
  d.chf = fader($(`.cf[data-deck="${d.id}"]`), { vertical: true, def: .9, onChange: v => { d.vol = v; d.applyVol(); } });
}

/* =================== Arranque =================== */
const decks = [new Deck('A'), new Deck('B')];
decks.forEach(d => { wire(d); refresh(d); });
const xfc = fader($('.xf'), { vertical: false, def: .5, onChange: v => { xval = v; applyXfader(); } });

$('.fxprev').addEventListener('click', () => { fxS.type = (fxS.type + FX_TYPES.length - 1) % FX_TYPES.length; applyFx(); });
$('.fxnext').addEventListener('click', () => { fxS.type = (fxS.type + 1) % FX_TYPES.length; applyFx(); });
$('.bdown').addEventListener('click', () => { fxS.beat = Math.max(0, fxS.beat - 1); applyFx(); });
$('.bup').addEventListener('click', () => { fxS.beat = Math.min(FX_BEATS.length - 1, fxS.beat + 1); applyFx(); });
$$('.seg .btn').forEach(b => b.addEventListener('click', () => { fxS.ch = b.dataset.ch; applyFx(); }));
$('.fxon').addEventListener('pointerdown', () => { fxS.on = !fxS.on; applyFx(); });
knob($('.fxlevel'), .5, v => { fxS.level = v; applyFx(); });
knob($('.smpvol'), .8, v => { fxS.smp = v; if (smpGain) smpGain.gain.value = v * v * 1.2; });
applyFx();

$('.libbtn').addEventListener('click', () => { $('.sheet').classList.add('open'); renderLib(); });
$('.libclose').addEventListener('click', () => $('.sheet').classList.remove('open'));
$('.search').addEventListener('input', renderLib);
const inDir = $('.in-dir'), inFiles = $('.in-files');
inFiles.setAttribute('accept', ACCEPT);
if (!('webkitdirectory' in inDir)) $('.libdir').hidden = true;
$('.libdir').addEventListener('click', () => inDir.click());
$('.libfiles').addEventListener('click', () => inFiles.click());
[inDir, inFiles].forEach(inp => inp.addEventListener('change', () => { const f = [...inp.files]; inp.value = ''; libAdd(f); }));
$('.libclear').addEventListener('click', async () => {
  if (!lib.length) return;
  if (!await ask('Vaciar biblioteca', 'Se quitan todos los temas de la app. Los archivos originales en tu teléfono no se borran.', 'Vaciar')) return;
  try { await tx('readwrite', st => st.clear()); } catch (e) {}
  lib = []; renderLib();
});
$('.list').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = +row.dataset.id;
  if (e.target.closest('.del')) libRemove(id);
  else { const b = e.target.closest('.ld'); if (b) loadFromLib(id, b.dataset.deck); }
});
$('.modal .ok').addEventListener('click', () => closeAsk(true));
$('.modal .cancel').addEventListener('click', () => closeAsk(false));
$('.modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAsk(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && askResolve) closeAsk(false); });
$('.ambtn').addEventListener('click', () => { renderAm(); $('.am').classList.add('open'); });
$('.am-close').addEventListener('click', () => $('.am').classList.remove('open'));
$('.am').addEventListener('click', e => { if (e.target === e.currentTarget) $('.am').classList.remove('open'); });
$('.am-start').addEventListener('click', () => { $('.am').classList.remove('open'); amStart(); });
$('.am-stop').addEventListener('click', () => { $('.am').classList.remove('open'); amStop('Automix detenido'); });
$('.am-now').addEventListener('click', () => { am.now = true; $('.am').classList.remove('open'); });
$$('.am .amseg .btn').forEach(b => b.addEventListener('click', () => {
  const k = b.parentElement.dataset.set; am[k] = k === 'beats' ? +b.dataset.v : b.dataset.v; renderAm();
}));
$$('.smp .btn').forEach(b => b.addEventListener('click', () => {
  const d = decks.find(x => x.id === b.dataset.deck);
  d.mode = 'smp'; refresh(d); if (d.tab !== 'pads') openTab(d, 'pads');
}));
libLoad().then(restoreSession);

/* Vista de PC: los mismos controles se mueven a la distribución de controlador cuando la pantalla es grande */
const MOVES = [], SNAP = [];
(function initDesk() {
  const add = (node, slot) => { if (node && slot) MOVES.push([node, slot]); };
  for (const d of decks) {
    const r = $(`.deck[data-deck="${d.id}"]`), D = sel => $(`.d-deck[data-deck="${d.id}"] ${sel}`);
    add($(`.wrow[data-deck="${d.id}"]`), $('.d-waves'));
    ['.key', '.range', '.pf', '.pv', '.sync'].forEach(c => add($(c, r), D('.s-tempo')));
    add($('.cue', r), D('.s-tp')); add($('.play', r), D('.s-tp'));
    add($('.stage', r), D('.s-jog'));
    add($('.loops', r), D('.s-loops'));
    add($('.modes', r), D('.s-modes'));
    add($('.pads', r), D('.s-pads'));
    add($(`.strip[data-deck="${d.id}"]`), $(`.d-mixer .s-strip[data-deck="${d.id}"]`));
  }
  add($('.side'), $('.d-side'));
  add($('.fxp'), $('.s-fx'));
  add($('.cf[data-deck="A"]'), $('.s-fa')); add($('.meters'), $('.s-mt')); add($('.cf[data-deck="B"]'), $('.s-fb'));
  add($('.xrow'), $('.s-xf'));
  const parents = new Set(MOVES.map(([n]) => n.parentNode));
  parents.forEach(pn => SNAP.push([pn, [...pn.children]]));
  $('.d-side').insertBefore($('.fsbtn'), null);
})();
let isDesk = false;
function setDesk(on) {
  if (on === isDesk) return;
  isDesk = on;
  decks.forEach(d => openTab(d, null));
  if (on) MOVES.forEach(([n, slot]) => slot.appendChild(n));
  else SNAP.forEach(([pn, kids]) => kids.forEach(k => pn.appendChild(k)));
  if (on) $('.d-side').appendChild($('.fsbtn'));
  document.body.classList.toggle('dk', on);
  requestAnimationFrame(layout);
}
const wantDesk = () => innerWidth >= 1024 && innerHeight >= 600;
setDesk(wantDesk());
addEventListener('resize', () => setDesk(wantDesk()));
$('.fsbtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
});
document.addEventListener('fullscreenchange', () => { $('.fsbtn').textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa'; fit($('.fsbtn')); });
new ResizeObserver(layout).observe(document.body);
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
requestAnimationFrame(frame);

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
